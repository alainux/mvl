<script type="application/json" id="mvgData">{"recipes":[{"id":"be","group":"Fundamentals","title":"Say what you are / how you feel","name":"I am…","syntax":"Ich bin + name / adjective.","summary":"Make a basic statement about yourself.","rule":"Use ich bin for “I am”. An adjective after sein normally has no ending.","examples":[["Ich bin Alex.","I am Alex."],["Ich bin müde.","I am tired."],["Ich bin neu hier.","I am new here."]],"avoid":"Do not translate “I am 30 years old” literally with bin. Say: Ich bin 30 Jahre alt.","note":"Ich bin / du bist / er, sie, es ist / wir sind / Sie sind."},{"id":"have","group":"Fundamentals","title":"Say what you have","name":"I have…","syntax":"Ich habe + object.","summary":"Talk about what you have, or a scheduled appointment.","rule":"The object is usually in the accusative. Learn the full noun phrase together (e.g. einen Termin), not just the noun.","examples":[["Ich habe Zeit.","I have time."],["Ich habe einen Termin.","I have an appointment."],["Ich habe eine Frage.","I have a question."]],"avoid":"Masculine ein changes to einen for a direct object: ein Termin → einen Termin.","note":"For negative possession, learn: Ich habe keine Zeit. / Ich habe kein Bargeld."},{"id":"need","group":"Fundamentals","title":"Ask for what you need","name":"I need…","syntax":"Ich brauche + object.","summary":"A highly reusable structure for shops, services, and everyday life.","rule":"Brauchen takes a direct object. Store useful nouns as ready-made chunks: Hilfe, einen Termin, eine Quittung.","examples":[["Ich brauche Hilfe.","I need help."],["Ich brauche einen Termin.","I need an appointment."],["Ich brauche eine Quittung.","I need a receipt."]],"avoid":"Avoid Ich brauchen. With ich, the form is brauche.","note":"You can soften this by adding bitte: Ich brauche eine Quittung, bitte."},{"id":"want","group":"Fundamentals","title":"Ask politely for something","name":"I would like…","syntax":"Ich möchte + object / ... infinitive.","summary":"The most useful polite request pattern.","rule":"For a thing, use a ready-made object phrase. For an action, put the main verb in its infinitive at the end.","examples":[["Ich möchte einen Kaffee.","I would like a coffee."],["Ich möchte bezahlen.","I would like to pay."],["Ich möchte einen Termin vereinbaren.","I would like to arrange an appointment."]],"avoid":"Ich will is grammatically correct but often sounds more forceful in requests. Ich möchte is a safe default.","note":"Want + action: Ich möchte + [other words] + [infinitive]."},{"id":"can","group":"Fundamentals","title":"Say what you can do","name":"I can…","syntax":"Ich kann + ... + infinitive.","summary":"Ability, possibility, or availability in a few words.","rule":"With kann, the action verb goes to the end in the infinitive.","examples":[["Ich kann heute kommen.","I can come today."],["Ich kann Deutsch lesen.","I can read German."],["Ich kann morgen nicht kommen.","I cannot come tomorrow."]],"avoid":"Do not say Ich kann bezahlen nicht. Say Ich kann nicht bezahlen.","note":"Ich kann is “I can”; Kann ich …? is “Can I …?”"},{"id":"must","group":"Fundamentals","title":"Say what you must do","name":"I have to…","syntax":"Ich muss + ... + infinitive.","summary":"State a requirement without a complex sentence.","rule":"The action verb stays in the infinitive at the end.","examples":[["Ich muss jetzt gehen.","I have to go now."],["Ich muss arbeiten.","I have to work."],["Ich muss morgen früh aufstehen.","I have to get up early tomorrow."]],"avoid":"Ich muss nicht means “I do not have to”, not “I must not”.","note":"To say “I must not”, use ich darf nicht."},{"id":"dont","group":"Fundamentals","title":"Say no / not","name":"Not / no","syntax":"Ich verstehe das nicht. | Ich habe keine Zeit.","summary":"Get far with a few reliable negative phrases.","rule":"Use nicht to negate an action or statement. Use kein/keine/keinen to say “no” with a noun. Memorize your most frequent negative noun phrases.","examples":[["Ich verstehe das nicht.","I do not understand that."],["Ich habe keine Zeit.","I have no time."],["Ich habe kein Bargeld.","I have no cash."]],"avoid":"Do not use kein instead of nicht in Ich verstehe das nicht.","note":"Start with fixed phrases. Learn the complete kein table only when you need it."},{"id":"help","group":"Questions","title":"Ask someone to help","name":"Could you…?","syntax":"Können Sie + ... + infinitive?","summary":"One flexible polite question works in countless situations.","rule":"Können Sie is formal “Can you”. The main action verb appears at the end.","examples":[["Können Sie mir helfen?","Can you help me?"],["Können Sie das bitte wiederholen?","Can you repeat that, please?"],["Können Sie das aufschreiben?","Can you write that down?"]],"avoid":"Sie here means polite “you”, so capitalize it.","note":"Add bitte to a request. Formal Sie works with strangers, staff, and officials."},{"id":"can-i","group":"Questions","title":"Ask permission or possibility","name":"Can I…?","syntax":"Kann ich + ... + infinitive?","summary":"Perfect for shops, restaurants, appointments, and travel.","rule":"Yes/no questions begin with the conjugated verb. The other verb is at the end.","examples":[["Kann ich mit Karte bezahlen?","Can I pay by card?"],["Kann ich hier sitzen?","Can I sit here?"],["Kann ich morgen kommen?","Can I come tomorrow?"]],"avoid":"Not Ich kann hier sitzen? for a neutral yes/no question. Lead with Kann.","note":"With a question word: Wo kann ich eine Fahrkarte kaufen?"},{"id":"where","group":"Questions","title":"Ask where something is","name":"Where is…?","syntax":"Wo ist + nominative noun phrase?","summary":"Ask for places without conjugation tables.","rule":"Learn the complete name with its article: der Bahnhof, die Toilette, das Rathaus.","examples":[["Wo ist der Bahnhof?","Where is the train station?"],["Wo ist die Toilette?","Where is the toilet?"],["Wo ist der Eingang?","Where is the entrance?"]],"avoid":"Use nominative after ist: Wo ist der Bahnhof? not Wo ist den Bahnhof?","note":"For a plural: Wo sind die Toiletten?"},{"id":"find","group":"Questions","title":"Say what you are looking for","name":"I am looking for…","syntax":"Ich suche + object.","summary":"An easy way to get directions or locate an item.","rule":"Suchen takes a direct object (accusative). For masculine nouns, der becomes den.","examples":[["Ich suche den Bahnhof.","I am looking for the train station."],["Ich suche die Apotheke.","I am looking for the pharmacy."],["Ich suche einen Geldautomaten.","I am looking for an ATM."]],"avoid":"Ich suche der Bahnhof is incorrect. Say den Bahnhof.","note":"You can add Entschuldigung at the beginning to get attention."},{"id":"exists","group":"Questions","title":"Ask whether something exists nearby","name":"Is there…?","syntax":"Gibt es hier + object?","summary":"Find a facility or service.","rule":"Gibt es takes an accusative object. For “a” use einen / eine / ein depending on the noun.","examples":[["Gibt es hier eine Toilette?","Is there a toilet here?"],["Gibt es hier einen Geldautomaten?","Is there an ATM here?"],["Gibt es hier WLAN?","Is there Wi-Fi here?"]],"avoid":"German says Gibt es, not Ist es, for “there is/are”.","note":"Hier means here. In der Nähe means nearby: Gibt es in der Nähe eine Apotheke?"},{"id":"howmuch","group":"Questions","title":"Ask about the price","name":"How much…?","syntax":"Wie viel kostet das?","summary":"A single fixed phrase covers most everyday prices.","rule":"Use das for a thing you can point to. For multiple items: Wie viel kosten die?","examples":[["Wie viel kostet das?","How much does that cost?"],["Wie viel kostet die Fahrkarte?","How much does the ticket cost?"],["Ist das kostenlos?","Is that free?"]],"avoid":"Do not confuse wie viel (how much) with wie viele (how many).","note":"Also useful: Was kostet das?"},{"id":"when","group":"Questions","title":"Ask when something happens","name":"When…?","syntax":"Wann + conjugated verb + ...?","summary":"Ask for times, openings, departures and appointments.","rule":"After the question word, put the conjugated verb next.","examples":[["Wann beginnt der Termin?","When does the appointment start?"],["Wann fährt der Zug?","When does the train depart?"],["Wann haben Sie Zeit?","When do you have time?"]],"avoid":"Wann der Zug fährt? is subordinate-clause order, not a standalone direct question.","note":"For a clock time, ask: Um wie viel Uhr?"},{"id":"yesno","group":"Questions","title":"Turn a statement into a question","name":"Do you…? / Is it…?","syntax":"Conjugated verb + subject + ...?","summary":"One word-order change creates a yes/no question.","rule":"Put the conjugated verb first in a normal yes/no question.","examples":[["Haben Sie Zeit?","Do you have time?"],["Ist das richtig?","Is that correct?"],["Funktioniert das?","Does that work?"]],"avoid":"German does not use a separate “do” to ask these questions.","note":"Answer: Ja, ... / Nein, ... / Leider nicht. (Unfortunately not.)"},{"id":"time","group":"Daily life","title":"Say when you are available","name":"Time and dates","syntax":"Ich komme am Montag um 14 Uhr.","summary":"Arrange ordinary plans without complex grammar.","rule":"Memorize these time chunks: heute, morgen, am Montag, um 14 Uhr, nächste Woche.","examples":[["Ich komme morgen.","I am coming tomorrow."],["Ich habe am Montag Zeit.","I have time on Monday."],["Ich habe um 15 Uhr einen Termin.","I have an appointment at 3 p.m."]],"avoid":"Within a sentence, Morgen (capitalized) means morning; morgen (lowercase) means tomorrow. At the start of a sentence, both begin with a capital M.","note":"am + weekday; um + clock time; im + month: im November."},{"id":"problem","group":"Daily life","title":"Report a problem","name":"There is a problem","syntax":"Es gibt ein Problem. | Das funktioniert nicht.","summary":"State the issue before describing details.","rule":"Short statements are enough for many repairs and help requests.","examples":[["Es gibt ein Problem.","There is a problem."],["Das funktioniert nicht.","That does not work."],["Mein Internet funktioniert nicht.","My internet is not working."]],"avoid":"Avoid stacking several ideas in one long sentence. Say one short sentence at a time.","note":"Then ask: Können Sie mir helfen?"},{"id":"understand","group":"Daily life","title":"Ask people to adjust their speech","name":"I don’t understand","syntax":"Ich lerne Deutsch. Bitte sprechen Sie langsam.","summary":"An essential communication repair strategy.","rule":"Use a short statement and then a polite request.","examples":[["Ich verstehe das nicht.","I do not understand that."],["Bitte sprechen Sie langsam.","Please speak slowly."],["Was bedeutet das?","What does that mean?"]],"avoid":"Avoid pretending to understand something important, especially dates, prices, or instructions.","note":"Other useful repair phrase: Können Sie das bitte aufschreiben?"},{"id":"past","group":"Daily life","title":"Talk about what happened","name":"Simple past events","syntax":"Ich habe gestern gearbeitet.","summary":"Learn a few extremely common past-tense chunks.","rule":"Conversation commonly uses the perfect tense: habe/bin + past participle. Start by memorizing whole sentences.","examples":[["Ich habe gestern gearbeitet.","I worked yesterday."],["Ich habe das schon gemacht.","I already did that."],["Ich bin gestern nach Hause gegangen.","I went home yesterday."]],"avoid":"Motion/change-of-state verbs often use sein: Ich bin gegangen, not Ich habe gegangen.","note":"For “was” and “had”, common simple-past forms are ich war / ich hatte."},{"id":"short","group":"Daily life","title":"Break complex thoughts into short sentences","name":"One idea per sentence","syntax":"Ich kann heute nicht kommen. Ich bin krank.","summary":"The simplest way to avoid difficult subordinate clauses.","rule":"Prefer two clear independent sentences to a sentence involving weil, dass, obwohl, or relative clauses.","examples":[["Ich kann heute nicht kommen. Ich bin krank.","I cannot come today. I am sick."],["Ich brauche Hilfe. Ich verstehe das Formular nicht.","I need help. I do not understand the form."],["Ich habe eine Frage. Haben Sie kurz Zeit?","I have a question. Do you have a moment?"]],"avoid":"“Short and clear” does not mean omitting the verb. Keep German verb order intact.","note":"Later you can join ideas with denn (because) or more advanced subordinate clauses."}],"grammar":[{"id":"verb2","title":"Rule 01 — Verb in position 2","short":"Normal statements put the conjugated verb in the second constituent.","syntax":"[Topic / time] + [conjugated verb] + [the rest].","body":"Think in chunks, not individual words. “Heute” can be the first chunk; then the verb must follow. This is the most valuable sentence-order rule in German.","examples":[["Ich brauche heute Hilfe.","I need help today."],["Heute brauche ich Hilfe.","Today I need help."],["Morgen kann ich kommen.","Tomorrow I can come."]],"pitfall":"Incorrect: Heute ich brauche Hilfe. Correct: Heute brauche ich Hilfe."},{"id":"questions","title":"Rule 02 — Questions","short":"Start yes/no questions with the verb; start information questions with the question word.","syntax":"[Verb] + [person] + ... ?\n[Question word] + [verb] + [person / rest] ... ?","body":"The two default question structures are enough for most practical questions.","examples":[["Haben Sie Zeit?","Do you have time?"],["Wo ist der Bahnhof?","Where is the station?"],["Wann kommen Sie?","When are you coming?"]],"pitfall":"Do not use English “do”: Haben Sie ...? already means “Do you have ...?”"},{"id":"modals","title":"Rule 03 — Modal-verb sandwich","short":"kann, muss, möchte, and darf are useful verbs that send the main verb to the end.","syntax":"Ich + kann/muss/möchte + [details] + [infinitive].","body":"Treat the second verb as a bookend. This pattern makes an enormous number of sentences possible.","examples":[["Ich möchte einen Termin machen.","I would like to make an appointment."],["Ich kann am Dienstag kommen.","I can come on Tuesday."],["Ich muss morgen arbeiten.","I have to work tomorrow."]],"pitfall":"Incorrect: Ich möchte kaufen eine Fahrkarte. Correct: Ich möchte eine Fahrkarte kaufen."},{"id":"sie","title":"Rule 04 — Polite “you”: Sie","short":"Use Sie with people you do not know; its verb generally matches the infinitive form.","syntax":"Können Sie mir helfen?\nHaben Sie Zeit?","body":"For everyday errands, defaulting to formal Sie is safe. You can learn informal du later. Capitalization distinguishes polite Sie from sie (“she/they”).","examples":[["Sprechen Sie Englisch?","Do you speak English?"],["Haben Sie einen Termin?","Do you have an appointment?"],["Können Sie mir das zeigen?","Can you show me that?"]],"pitfall":"With formal Sie: Sie haben, Sie können, Sie sind — not Sie hast, Sie kannst, Sie bist."},{"id":"articles","title":"Rule 05 — Learn noun phrases as chunks","short":"A few case distinctions are unavoidable; avoid full declension by memorizing complete useful phrases.","syntax":"der Termin → einen Termin (object)\ndie Frage → eine Frage (object)\ndas Ticket → ein Ticket (object)","body":"German nouns have grammatical gender. For a direct object, masculine der/ein changes to den/einen; feminine and neuter articles generally keep their familiar nominative form. Store “einen Termin”, “eine Frage”, “ein Ticket” as if each were one dictionary entry.","examples":[["Ich brauche einen Termin.","I need an appointment."],["Ich habe eine Frage.","I have a question."],["Ich kaufe ein Ticket.","I am buying a ticket."]],"pitfall":"Incorrect: Ich brauche ein Termin. Correct: Ich brauche einen Termin."},{"id":"negation","title":"Rule 06 — nicht vs. kein","short":"Use nicht to negate an action or idea; use kein with many nouns.","syntax":"Ich verstehe das nicht.\nIch habe keine Zeit.","body":"The word nicht can move depending on what is being negated. In this minimum system, learn reliable sentences first. Kein behaves like an article and changes form with the noun.","examples":[["Ich kann heute nicht kommen.","I cannot come today."],["Ich habe kein Geld.","I have no money."],["Ich habe keinen Termin.","I do not have an appointment."]],"pitfall":"“Ich muss nicht kommen” means “I do not have to come”; “Ich darf nicht kommen” means “I am not allowed to come”."},{"id":"timechunks","title":"Rule 07 — Handy time expressions","short":"Time vocabulary has reusable, low-effort patterns.","syntax":"heute / morgen / gestern\nam Montag / am Freitag\num 14 Uhr / um halb drei","body":"Use heute for today, morgen for tomorrow, gestern for yesterday. For a weekday use am. For a precise clock time use um. German halb drei means 2:30, not 3:30.","examples":[["Ich habe morgen Zeit.","I have time tomorrow."],["Der Termin ist am Freitag.","The appointment is on Friday."],["Der Zug kommt um 14 Uhr.","The train arrives at 2 p.m."]],"pitfall":"German halb drei is 2:30. If a time matters, repeat it back or write it down."},{"id":"directions","title":"Rule 08 — Directions as ready-made chunks","short":"Memorize destinations with their preposition, rather than learning every case rule now.","syntax":"nach Berlin / nach Hause\nzum Bahnhof / zur Apotheke\nmit dem Bus / mit der Bahn","body":"Many prepositions select a specific case. For a small speaking system, memorizing whole phrases is easier and remains grammatical.","examples":[["Ich fahre nach Berlin.","I am traveling to Berlin."],["Ich gehe zum Bahnhof.","I am going to the station."],["Ich fahre mit der Bahn.","I am going by train."]],"pitfall":"It is “nach Hause” (homeward) but “zu Hause” (at home). Learn them as separate expressions."},{"id":"pastgram","title":"Rule 09 — Past without a huge verb chart","short":"Learn the most useful past forms as pairs.","syntax":"ich habe + gearbeitet/gemacht/gekauft\nich bin + gegangen/gekommen/gefahren","body":"Spoken German usually uses Perfekt for past events. Use haben with many verbs, and sein with a number of motion/change-of-state verbs. “ich war” and “ich hatte” are also very common.","examples":[["Ich habe das gekauft.","I bought that."],["Ich bin gestern gekommen.","I came yesterday."],["Ich war krank.","I was sick."]],"pitfall":"Do not generalize haben to every verb: “Ich bin gegangen” is correct."},{"id":"shortgrammar","title":"Rule 10 — Prefer short sentences","short":"Avoid complex word-order changes by stating one point per sentence.","syntax":"Ich bin krank. Ich kann heute nicht kommen.","body":"Subordinate clauses can push the verb to the end. You do not need them for many routine conversations. Two short complete statements are often clearer.","examples":[["Ich brauche Hilfe. Das Gerät ist kaputt.","I need help. The device is broken."],["Ich habe eine Frage. Haben Sie Zeit?","I have a question. Do you have time?"],["Ich möchte das umtauschen. Hier ist die Quittung.","I would like to exchange this. Here is the receipt."]],"pitfall":"Do not omit finite verbs in complete statements: “Ich heute krank” is not the target pattern."}],"scenarios":[{"id":"intro","title":"Meeting someone","goal":"Introduce yourself and handle a basic conversation.","dialog":[["Person","Hallo! Wie heißen Sie?","Hello! What is your name?"],["You","Ich heiße Alex. Und Sie?","My name is Alex. And you?"],["Person","Woher kommen Sie?","Where are you from?"],["You","Ich komme aus Kanada. Ich lerne Deutsch.","I am from Canada. I am learning German."],["You","Können Sie bitte langsam sprechen?","Could you speak slowly, please?"]],"tip":"Ich heiße … and Ich komme aus … are better memorized as complete phrases."},{"id":"shop","title":"Shopping and returns","goal":"Ask for an item, its price, and a receipt.","dialog":[["You","Guten Tag. Ich suche eine Jacke.","Hello. I am looking for a jacket."],["Staff","Welche Größe brauchen Sie?","What size do you need?"],["You","Größe M, bitte.","Size M, please."],["You","Wie viel kostet das?","How much is that?"],["You","Kann ich mit Karte bezahlen?","Can I pay by card?"],["You","Ich brauche eine Quittung, bitte.","I need a receipt, please."]],"tip":"Größe means size; learn common answers S, M, L, XL and your shoe size."},{"id":"cafe","title":"At a café or restaurant","goal":"Order, request water, and pay.","dialog":[["Staff","Was möchten Sie?","What would you like?"],["You","Ich möchte einen Kaffee und ein Wasser, bitte.","I would like a coffee and a water, please."],["Staff","Sonst noch etwas?","Anything else?"],["You","Nein, danke.","No, thank you."],["You","Ich möchte bezahlen.","I would like to pay."],["You","Kann ich mit Karte bezahlen?","Can I pay by card?"]],"tip":"“Ein Wasser” is a common shorthand for a serving of water."},{"id":"direction","title":"Asking for directions","goal":"Find a station or another place.","dialog":[["You","Entschuldigung. Wo ist der Bahnhof?","Excuse me. Where is the station?"],["Person","Gehen Sie geradeaus und dann links.","Go straight ahead and then left."],["You","Können Sie das bitte wiederholen?","Could you repeat that, please?"],["Person","Geradeaus. Dann links.","Straight ahead. Then left."],["You","Danke schön!","Thank you very much!"]],"tip":"Directional basics: links = left; rechts = right; geradeaus = straight ahead."},{"id":"train","title":"Tickets and transport","goal":"Buy a ticket and confirm departure time.","dialog":[["You","Wo kann ich eine Fahrkarte kaufen?","Where can I buy a ticket?"],["Staff","Am Automaten.","At the machine."],["You","Wann fährt der nächste Zug?","When does the next train leave?"],["Staff","Um 14 Uhr 20.","At 2:20 p.m."],["You","Fährt der Zug nach Potsdam?","Does the train go to Potsdam?"],["Staff","Ja.","Yes."]],"tip":"A confirmation question like “Fährt der Zug nach …?” reduces mistakes."},{"id":"booking","title":"Making an appointment","goal":"Request, schedule, and change an appointment.","dialog":[["You","Guten Tag. Ich brauche einen Termin.","Hello. I need an appointment."],["Staff","Haben Sie am Montag Zeit?","Are you available on Monday?"],["You","Am Montag kann ich nicht. Ich habe am Dienstag Zeit.","I cannot on Monday. I am free on Tuesday."],["Staff","Um 10 Uhr?","At 10 a.m.?"],["You","Ja, das passt. Vielen Dank.","Yes, that works. Thank you very much."]],"tip":"For rebooking: Ich möchte den Termin ändern. = I want to change the appointment."},{"id":"doctor","title":"At a doctor’s office or pharmacy","goal":"Give simple information and ask for clarification.","dialog":[["Staff","Was ist das Problem?","What is the problem?"],["You","Ich habe Kopfschmerzen.","I have a headache."],["You","Seit gestern.","Since yesterday."],["Staff","Nehmen Sie Medikamente?","Are you taking medication?"],["You","Ja. Ich habe eine Liste.","Yes. I have a list."],["You","Können Sie das bitte aufschreiben?","Could you write that down, please?"]],"tip":"For medical information, make sure you really understand instructions. Ask for written instructions or an interpreter if needed."},{"id":"office","title":"At an office or public service","goal":"Explain what you need and ask about documents.","dialog":[["You","Guten Tag. Ich habe einen Termin.","Hello. I have an appointment."],["Staff","Haben Sie Ihren Ausweis dabei?","Do you have your ID with you?"],["You","Ja, hier ist mein Ausweis.","Yes, here is my ID."],["You","Ich habe eine Frage zu diesem Formular.","I have a question about this form."],["You","Können Sie mir bitte helfen?","Could you please help me?"]],"tip":"Forms and official processes may need precise wording. Ask for a written explanation when necessary."},{"id":"housing","title":"Housing and repairs","goal":"Report a problem clearly.","dialog":[["You","Guten Tag. Es gibt ein Problem in meiner Wohnung.","Hello. There is a problem in my apartment."],["Person","Was ist kaputt?","What is broken?"],["You","Die Heizung funktioniert nicht.","The heating is not working."],["You","Können Sie mir helfen?","Can you help me?"],["You","Wann kann jemand kommen?","When can someone come?"]],"tip":"Die Heizung (heating), das Wasser (water), der Strom (electricity), das Internet."},{"id":"work","title":"Simple workplace communication","goal":"Say what you can do and ask for instructions.","dialog":[["Colleague","Haben Sie heute Zeit?","Do you have time today?"],["You","Heute nicht. Ich habe morgen Zeit.","Not today. I am available tomorrow."],["You","Ich habe eine Frage.","I have a question."],["You","Können Sie mir das bitte zeigen?","Could you show me that, please?"],["You","Danke. Jetzt verstehe ich das.","Thanks. Now I understand it."]],"tip":"For informal colleagues who use du, the matching question is “Kannst du mir helfen?”"},{"id":"problemcall","title":"When communication breaks down","goal":"Slow the conversation down and check meaning.","dialog":[["Person","…","…"],["You","Entschuldigung. Ich lerne Deutsch.","Sorry. I am learning German."],["You","Können Sie bitte langsamer sprechen?","Could you speak more slowly, please?"],["Person","Natürlich.","Of course."],["You","Was bedeutet dieses Wort?","What does this word mean?"],["You","Können Sie das bitte aufschreiben?","Could you write that down, please?"]],"tip":"Repeating a time, address, name or price back is often more useful than pretending to understand."},{"id":"social","title":"A simple social invitation","goal":"Make a plan without needing complex conditionals.","dialog":[["Person","Haben Sie am Samstag Zeit?","Are you free on Saturday?"],["You","Ja, ich habe Zeit.","Yes, I am free."],["Person","Möchten Sie einen Kaffee trinken?","Would you like to have a coffee?"],["You","Ja, gern!","Yes, gladly!"],["You","Wo treffen wir uns?","Where shall we meet?"],["Person","Um 15 Uhr am Bahnhof.","At 3 p.m. at the station."]],"tip":"Ja, gern! = Yes, gladly. Das passt. = That works. Leider nicht. = Unfortunately not."}],"phrases":[{"category":"Basics","de":"Guten Tag.","en":"Hello / good day.","id":"ph0"},{"category":"Basics","de":"Guten Morgen.","en":"Good morning.","id":"ph1"},{"category":"Basics","de":"Hallo.","en":"Hello.","id":"ph2"},{"category":"Basics","de":"Auf W ilette?","en":"Where is the toilet?","id":"ph47"},{"category":"Directions & travel","de":"Wo ist die Haltestelle?","en":"Where is the stop?","id":"ph48"},{"category":"Directions & travel","de":"Ich suche die Apotheke.","en":"I am looking for the pharmacy.","id":"ph49"},{"category":"Directions & travel","de":"Gibt es hier einen Geldautomaten?","en":"Is there an ATM here?","id":"ph50"},{"category":"Directions & travel","de":"Wo kann ich eine Fahrkarte kaufen?","en":"Where can I buy a ticket?","id":"ph51"},{"category":"Directions & travel","de":"Wann fährt der Zug?","en":"When does the train depart?","id":"ph52"},{"category":"Directions & travel","de":"Fährt dieser Zug nach Berlin?","en":"Does this train go to Berlin?","id":"ph53"},{"category":"Directions & travel","de":"Ist das der richtige Zug?","en":"Is this the right train?","id":"ph54"},{"category":"Time & appointments","de":"Ich brauche einen Termin.","en":"I need an appointment.","id":"ph55"},{"category":"Time & appointments","de":"Ich habe einen Termin.","en":"I have an appointment.","id":"ph56"},{"category":"Time & appointments","de":"Ich möchte den Termin ändern.","en":"I would like to change the appointment.","id":"ph57"},{"category":"Time & appointments","de":"Haben Sie morgen Zeit?","en":"Are you available tomorrow?","id":"ph58"},{"category":"Time & appointments","de":"Ich komme am Montag.","en":"I am coming on Monday.","id":"ph59"},{"category":"Time & appointments","de":"Um wie viel Uhr?","en":"At what time?","id":"ph60"},{"category":"Time & appointments","de":"Das passt.","en":"That works.","id":"ph61"},{"category":"Time & appointments","de":"Leider nicht.","en":"Unfortunately not.","id":"ph62"},{"category":"Time & appointments","de":"Können wir das verschieben?","en":"Can we postpone that?","id":"ph63"},{"category":"Home & work","de":"Die Heizung funktioniert nicht.","en":"The heating is not working.","id":"ph64"},{"category":"Home & work","de":"Das Internet funktioniert nicht.","en":"The internet is not working.","id":"ph65"},{"category":"Home & work","de":"Wann kann jemand kommen?","en":"When can someone come?","id":"ph66"},{"category":"Home & work","de":"Ich muss arbeiten.","en":"I have to work.","id":"ph67"},{"category":"Home & work","de":"Ich kann morgen kommen.","en":"I can come tomorrow.","id":"ph68"},{"category":"Home & work","de":"Können Sie mir das zeigen?","en":"Can you show me that?","id":"ph69"},{"category":"Home & work","de":"Ich habe eine Frage zu diesem Formular.","en":"I have a question about this form.","id":"ph70"},{"category":"Home & work","de":"Wo soll ich unterschreiben?","en":"Where should I sign?","id":"ph71"},{"category":"Health","de":"Ich habe Schmerzen.","en":"I am in pain.","id":"ph72"},{"category":"Health","de":"Ich habe Kopfschmerzen.","en":"I have a headache.","id":"ph73"},{"category":"Health","de":"Ich bin seit gestern krank.","en":"I have been sick since yesterday.","id":"ph74"},{"category":"Health","de":"Ich brauche einen Arzt.","en":"I need a doctor.","id":"ph75"},{"category":"Health","de":"Ich brauche eine Apotheke.","en":"I need a pharmacy.","id":"ph76"},{"category":"Health","de":"Bitte schreiben Sie das auf.","en":"Please write that down.","id":"ph77"},{"category":"Health","de":"Ich habe eine Liste meiner Medikamente.","en":"I have a list of my medications.","id":"ph78"},{"category":"Social","de":"Wie geht es Ihnen?","en":"How are you? (formal)","id":"ph79"},{"category":"Social","de":"Gut, danke. Und Ihnen?","en":"Good, thank you. And you?","id":"ph80"},{"category":"Social","de":"Möchten Sie einen Kaffee trinken?","en":"Would you like to have a coffee?","id":"ph81"},{"category":"Social","de":"Ja, gern.","en":"Yes, gladly.","id":"ph82"},{"category":"Social","de":"Wo treffen wir uns?","en":"Where shall we meet?","id":"ph83"},{"category":"Social","de":"Bis morgen!","en":"See you tomorrow!","id":"ph84"},{"category":"Social","de":"Schönen Tag noch!","en":"Have a nice rest of your day!","id":"ph85"}],"builders":[{"id":"need","name":"I need something","instruction":"Choose a complete object phrase. The right article is already included.","start":"Ich brauche ","end":".","eng":"I need {}.","options":[["Hilfe","help"],["einen Termin","an appointment"],["eine Quittung","a receipt"],["ein Ticket","a ticket"],["Wasser","water"],["eine Pause","a break"],["Informationen","information"],["einen Arzt","a doctor"]],"recipe":"need"},{"id":"want","name":"I would like something","instruction":"A polite request with an object.","start":"Ich möchte ","end":".","eng":"I would like {}.","options":[["einen Kaffee","a coffee"],["ein Wasser","a water"],["eine Fahrkarte","a ticket"],["einen Tee","a tea"],["eine Rechnung","a bill"],["ein Zimmer","a room"]],"recipe":"want"},{"id":"wantdo","name":"I would like to do something","instruction":"Notice that the action verb appears at the end.","start":"Ich möchte ","end":".","eng":"I would like to {}.","options":[["bezahlen","pay"],["Deutsch lernen","learn German"],["eine Fahrkarte kaufen","buy a ticket"],["einen Termin vereinbaren","arrange an appointment"],["das Formular ausfüllen","fill in the form"],["hier warten","wait here"],["das umtauschen","exchange that"]],"recipe":"want"},{"id":"cani","name":"Can I…?","instruction":"A yes/no question starts with kann.","start":"Kann ich ","end":"?","eng":"Can I {}?","options":[["mit Karte bezahlen","pay by card"],["hier sitzen","sit here"],["morgen kommen","come tomorrow"],["das ausprobieren","try that"],["das umtauschen","exchange that"],["die Toilette benutzen","use the toilet"],["kurz etwas fragen","ask a quick question"]],"recipe":"can-i"},{"id":"couldyou","name":"Can you…? (polite)","instruction":"Sie is polite “you”; the action goes at the end.","start":"Können Sie ","end":"?","eng":"Can you {}?","options":[["mir helfen","help me"],["das bitte wiederholen","repeat that, please"],["bitte langsamer sprechen","speak more slowly, please"],["das aufschreiben","write that down"],["mir den Weg zeigen","show me the way"],["mir das erklären","explain that to me"]],"recipe":"help"},{"id":"where","name":"Where is…?","instruction":"The phrase includes the correct article for the subject.","start":"Wo ist ","end":"?","eng":"Where is {}?","options":[["der Bahnhof","the train station"],["die Toilette","the toilet"],["der Eingang","the entrance"],["die Haltestelle","the stop"],["die Apotheke","the pharmacy"],["das Rathaus","the town hall"],["der Aufzug","the elevator"],["die Kasse","the checkout"]],"recipe":"where"},{"id":"looking","name":"I am looking for…","instruction":"The object phrases already include accusative articles.","start":"Ich suche ","end":".","eng":"I am looking for {}.","options":[["den Bahnhof","the train station"],["die Haltestelle","the stop"],["die Toilette","the toilet"],["das Rathaus","the town hall"],["einen Geldautomaten","an ATM"],["meine Tasche","my bag"],["eine Wohnung","an apartment"]],"recipe":"find"},{"id":"there","name":"Is there…?","instruction":"Gibt es uses the accusative; keep the whole noun phrase.","start":"Gibt es hier ","end":"?","eng":"Is there {} here?","options":[["eine Toilette","a toilet"],["einen Geldautomaten","an ATM"],["eine Apotheke","a pharmacy"],["ein Café","a café"],["WLAN","Wi-Fi"],["einen Aufzug","an elevator"]],"recipe":"exists"},{"id":"price","name":"How much does… cost?","instruction":"Use a nominative noun phrase because it is the subject of kosten.","start":"Wie viel kostet ","end":"?","eng":"How much does {} cost?","options":[["das","that"],["die Fahrkarte","the ticket"],["der Kaffee","the coffee"],["das Zimmer","the room"],["die Reparatur","the repair"],["der Eintritt","admission"]],"recipe":"howmuch"},{"id":"available","name":"I am available…","instruction":"Say your availability with a memorized time expression.","start":"Ich habe ","end":" Zeit.","eng":"I am free {}.","options":[["morgen","tomorrow"],["heute","today"],["am Montag","on Monday"],["am Dienstag","on Tuesday"],["heute Nachmittag","this afternoon"],["nächste Woche","next week"]],"recipe":"time"}],"quiz":[{"prompt":"I need help.","options":["Ich brauche Hilfe.","Ich brauchen Hilfe.","Ich bin Hilfe.","Ich Hilfe brauche."],"correct":0,"explanation":"With ich use brauche; a normal statement puts the verb in position two."},{"prompt":"Where is the station?","options":["Wo den Bahnhof ist?","Wo ist der Bahnhof?","Wo der Bahnhof?","Was ist Bahnhof?"],"correct":1,"explanation":"In a direct question: Wo + ist + noun phrase. Der Bahnhof is nominative."},{"prompt":"Can you help me? (formal)","options":["Kannst Sie mir helfen?","Sie können mir helfen?","Können Sie mir helfen?","Können Sie helfen mir?"],"correct":2,"explanation":"The yes/no question starts with Können; formal Sie follows, then the main verb goes at the end."},{"prompt":"I have an appointment.","options":["Ich habe ein Termin.","Ich habe einen Termin.","Ich bin einen Termin.","Ich habe der Termin."],"correct":1,"explanation":"Termin is masculine; a direct object needs einen."},{"prompt":"Can I pay by card?","options":["Kann ich mit Karte bezahlen?","Ich bezahlen kann mit Karte?","Kann mit Karte ich bezahlen?","Ich kann mit Karte bezahlen."],"correct":0,"explanation":"Kann ich is the question opening; bezahlen is the infinitive at the end."},{"prompt":"I would like to pay.","options":["Ich möchte bezahle.","Ich möchten bezahlen.","Ich möchte bezahlen.","Ich bin bezahlen."],"correct":2,"explanation":"With möchte, use an infinitive: bezahlen."},{"prompt":"Do you have time? (formal)","options":["Sie haben Zeit?","Haben Sie Zeit?","Hat Sie Zeit?","Hast Sie Zeit?"],"correct":1,"explanation":"A standard yes/no question starts with the conjugated verb: Haben Sie …?"},{"prompt":"I have no time.","options":["Ich habe nicht Zeit.","Ich habe keinen Zeit.","Ich habe keine Zeit.","Ich nicht habe Zeit."],"correct":2,"explanation":"Zeit is feminine; the common phrase is keine Zeit."},{"prompt":"I cannot come tomorrow.","options":["Ich kann morgen nicht kommen.","Ich kann nicht morgen kommen nicht.","Ich nicht kann morgen kommen.","Ich kann morgen kommen nicht."],"correct":0,"explanation":"With a modal verb, the main infinitive stays at the end."},{"prompt":"How much does that cost?","options":["Wie viele kostet das?","Wie viel kosten das?","Wie viel kostet das?","Wo viel kostet das?"],"correct":2,"explanation":"Wie viel asks “how much”, and singular das takes kostet."},{"prompt":"I am looking for the station.","options":["Ich suche der Bahnhof.","Ich suche den Bahnhof.","Ich suche dem Bahnhof.","Ich bin suche Bahnhof."],"correct":1,"explanation":"Suchen takes an accusative object; masculine der becomes den."},{"prompt":"Could you repeat that, please?","options":["Können Sie das bitte wiederholen?","Können Sie das bitte wiederholt?","Sie können wiederholen das bitte?","Kann Sie das bitte wiederholen?"],"correct":0,"explanation":"Können Sie ... wiederholen? is the polite modal-question pattern."},{"prompt":"Today I need help.","options":["Heute ich brauche Hilfe.","Heute brauchen ich Hilfe.","Heute brauche ich Hilfe.","Heute bin brauche Hilfe."],"correct":2,"explanation":"When heute is the first constituent, the conjugated verb immediately follows."},{"prompt":"Is there a toilet here?","options":["Gibt es hier eine Toilette?","Ist es hier eine Toilette?","Gibt hier es die Toilette?","Gibt es hier einen Toilette?"],"correct":0,"explanation":"Gibt es is “is there”, and Toilette is feminine: eine Toilette."},{"prompt":"I am tired.","options":["Ich habe müde.","Ich bist müde.","Ich bin müde.","Ich müde bin."],"correct":2,"explanation":"Use ich bin with an adjective."},{"prompt":"I must work tomorrow.","options":["Ich muss morgen arbeiten.","Ich muss arbeiten morgen.","Ich müssen morgen arbeiten.","Ich morgen muss arbeiten."],"correct":0,"explanation":"Muss is conjugated; arbeiten goes at the end."},{"prompt":"I worked yesterday.","options":["Ich bin gestern gearbeitet.","Ich habe gestern gearbeitet.","Ich habe gestern arbeiten.","Ich gestern habe gearbeitet."],"correct":1,"explanation":"Arbeiten normally forms Perfekt with haben: habe gearbeitet."},{"prompt":"I went home yesterday.","options":["Ich habe gestern nach Hause gegangen.","Ich bin gestern zu Hause gegangen.","Ich bin gestern nach Hause gegangen.","Ich bin gestern gegangen nach Hause."],"correct":2,"explanation":"Gehen takes sein in the perfect, and nach Hause means “homeward”."},{"prompt":"When is the appointment?","options":["Wann ist der Termin?","Wann der Termin ist?","Wann hat der Termin?","Was ist der Termin wann?"],"correct":0,"explanation":"Wann + conjugated verb + subject is a direct question."},{"prompt":"I have a question.","options":["Ich habe eine Frage.","Ich habe ein Frage.","Ich bin eine Frage.","Ich haben eine Frage."],"correct":0,"explanation":"Frage is feminine; as an object, it remains eine Frage."},{"prompt":"Please speak slowly. (formal)","options":["Bitte sprich Sie langsam.","Bitte sprechen Sie langsam.","Bitte spricht Sie langsam.","Bitte Sie sprechen langsam."],"correct":1,"explanation":"Polite requests use sprechen Sie (the Sie verb form)."},{"prompt":"Where can I buy a ticket?","options":["Wo kann ich eine Fahrkarte kaufen?","Wo ich kann eine Fahrkarte kaufen?","Wo kann ich kaufen eine Fahrkarte?","Wo möchte kaufen Fahrkarte?"],"correct":0,"explanation":"Question word + modal + subject; the infinitive kaufen remains at the end."},{"prompt":"I do not understand that.","options":["Ich verstehe das kein.","Ich verstehen nicht das.","Ich das nicht verstehe.","Ich verstehe das nicht."],"correct":3,"explanation":"The straightforward phrase is Ich verstehe das nicht."},{"prompt":"The heating is not working.","options":["Die Heizung funktioniert nicht.","Die Heizung nicht funktioniert.","Der Heizung funktioniert nicht.","Die Heizung funktioniert kein."],"correct":0,"explanation":"Die Heizung is feminine; nicht negates the verb."}],"writing":[{"prompt":"You need an appointment.","model":"Ich brauche einen Termin.","tip":"Need + accusative object: einen Termin."},{"prompt":"Ask someone politely to help you.","model":"Können Sie mir helfen?","tip":"Können Sie + infinitive is the polite request pattern."},{"prompt":"Say you cannot come tomorrow.","model":"Ich kann morgen nicht kommen.","tip":"kann + ... + infinitive; nicht negates coming."},{"prompt":"Ask where the bathroom is.","model":"Wo ist die Toilette?","tip":"Wo ist + nominative noun phrase."},{"prompt":"Ask whether you can pay by card.","model":"Kann ich mit Karte bezahlen?","tip":"Start a question with Kann ich; bezahlen goes last."},{"prompt":"Say you do not understand.","model":"Ich verstehe das nicht.","tip":"A reliable communication-repair phrase."},{"prompt":"Ask someone to speak more slowly.","model":"Können Sie bitte langsamer sprechen?","tip":"Polite request with a comparative: langsamer."},{"prompt":"Say you have a question.","model":"Ich habe eine Frage.","tip":"Complete noun phrase with eine."},{"prompt":"Ask when the train departs.","model":"Wann fährt der Zug?","tip":"Question word + conjugated verb + subject."},{"prompt":"Say you would like to buy a ticket.","model":"Ich möchte eine Fahrkarte kaufen.","tip":"Put the infinitive kaufen at the end."},{"prompt":"Say the device does not work.","model":"Das Gerät funktioniert nicht.","tip":"Subject + verb + nicht."},{"prompt":"Say you are free on Monday.","model":"Ich habe am Montag Zeit.","tip":"am + weekday."},{"prompt":"Say you worked yesterday.","model":"Ich habe gestern gearbeitet.","tip":"Common perfect form: habe gearbeitet."},{"prompt":"Say you are learning German.","model":"Ich lerne Deutsch.","tip":"One short complete sentence."}],"roadmap":[{"title":"Phase 1 · Survive the first interaction","subtitle":"Requests, basic sentences, and polite questions","items":[["Learn “I am / I have / I need”","be"],["Learn “I would like / I can”","want"],["Learn polite “Can you ...?”","help"],["Learn “Where is ...?”","where"],["Learn 10 basics phrases","phrases"],["Finish one 10-question practice s
